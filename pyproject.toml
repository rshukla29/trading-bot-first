[project]
name = "tradingbot"
version = "0.1.0"
description = "Automated swing-trading bot: IBKR (ib_async) + Robinhood Agentic Trading (MCP)"
requires-python = ">=3.11"
dependencies = [
    "ib_async>=1.0.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "yfinance>=0.2.40",
    "lxml>=5.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
